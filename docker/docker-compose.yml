# Toppo: self-hosted issue tracker.
#
#   1. Create a .env file next to this one:
#        echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env
#   2. Start:
#        docker compose up -d
#   3. Open http://localhost:3000
#
# Every setting is documented in .env.example.
name: toppo

services:
  toppo:
    image: ghcr.io/kevinbrt/toppo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      TOPPO_URL: ${TOPPO_URL:-http://localhost:3000}
      TOPPO_DATABASE_URL: postgres://toppo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/toppo
      TOPPO_TRUST_PROXY: ${TOPPO_TRUST_PROXY:-false}
      TOPPO_LOG_LEVEL: ${TOPPO_LOG_LEVEL:-info}
      TOPPO_SECRET: ${TOPPO_SECRET:-}
      TOPPO_SETUP_CODE: ${TOPPO_SETUP_CODE:-}
      TOPPO_ATTACHMENT_MAX_SIZE_MB: ${TOPPO_ATTACHMENT_MAX_SIZE_MB:-}
    volumes:
      - toppo-data:/data
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Already running PostgreSQL 16 or newer? Remove this service and point TOPPO_DATABASE_URL at it.
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: toppo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: toppo
    volumes:
      - toppo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toppo -d toppo"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  toppo-data:
  toppo-db:
