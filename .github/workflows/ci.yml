name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, conventions, dependencies, types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx prettier --check .
      - run: npm run check:conventions
      - run: npm run check:dependencies
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  test:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current major.
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: toppo
          POSTGRES_PASSWORD: toppo
          POSTGRES_DB: toppo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toppo -d toppo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://toppo:toppo@localhost:5432/toppo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload coverage
        if: always() && matrix.postgres == '18'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: "**/coverage/"
          retention-days: 14

  e2e:
    name: End-to-end on the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ghcr.io/kevinbrt/toppo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start Toppo with the user-facing docker-compose.yml
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "IMAGE_TAG=ci"
            echo "HTTP_PORT=3000"
            echo "TOPPO_URL=http://localhost:3000"
            echo "TOPPO_UPDATE_CHECK=false"
          } > "$RUNNER_TEMP/toppo.env"
          docker compose --env-file "$RUNNER_TEMP/toppo.env" -f docker/docker-compose.yml up -d --wait
      - name: Read the setup code from the logs, as a user would
        run: |
          code=$(docker compose --env-file "$RUNNER_TEMP/toppo.env" -f docker/docker-compose.yml logs toppo \
            | grep -oE '[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}' | tail -n 1)
          if [ -z "$code" ]; then
            echo "::error::No setup code found in the logs"
            exit 1
          fi
          echo "E2E_SETUP_CODE=$code" >> "$GITHUB_ENV"
      - name: Run Playwright
        run: npm run test:e2e --workspace=@toppo-tracker/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/toppo.env" -f docker/docker-compose.yml logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  publish-edge:
    name: Publish edge image
    needs: [quality, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tags: |
        ghcr.io/kevinbrt/toppo:edge
        ghcr.io/kevinbrt/toppo:sha-${{ github.sha }}
      version: edge-${{ github.sha }}
